name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real identity documents or personal data.** Reproduce with the synthetic
        samples (`id-tamper-check --demo`, `examples/`) or images you are allowed to share publicly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command or code and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `id-tamper-check --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
